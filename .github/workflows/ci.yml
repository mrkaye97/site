name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check
        run: pnpm check

      # On main, the Publish site workflow builds the site instead.
      - name: Restore Astro cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ github.sha }}
          restore-keys: astro-

      - name: Build
        if: github.ref != 'refs/heads/main'
        run: pnpm build
