name: Publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore Astro cache
        id: astro-cache
        uses: actions/cache@v4
        with:
          path: astro-cache
          key: astro-docker-${{ github.sha }}
          restore-keys: astro-docker-

      - name: Inject Astro cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "astro-cache": {
                "target": "/app/node_modules/.astro",
                "id": "astro"
              }
            }
          skip-extraction: ${{ steps.astro-cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: mrkaye97/site:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
