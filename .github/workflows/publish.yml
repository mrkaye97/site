name: Publish site

# Builds the site and publishes it as a `build-<sha>` release holding
# site.tar.gz and its checksum, site.sha256. The Pi deploys whichever release
# is marked Latest (see crons/scripts/pull_deploy.sh in the pi repo).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Astro cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ github.sha }}
          restore-keys: astro-

      - name: Build
        run: pnpm build

      - name: Package
        run: |
          tar -czf site.tar.gz -C dist .
          sha256sum site.tar.gz > site.sha256

      # One release per build. The Pi deploys whichever release is marked
      # Latest, so marking an older one Latest in the GitHub UI rolls back.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA::7}"
          # A re-run of the same commit replaces its release.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          # gh uploads the files to a draft and publishes it after, so the
          # release only becomes Latest once both files are there.
          gh release create "$tag" site.tar.gz site.sha256 \
            --target "$GITHUB_SHA" --latest --title "$tag" \
            --notes "Built from $GITHUB_SHA: $(git log -1 --format=%s)"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            xargs -r -n1 gh release delete --cleanup-tag --yes
